      <div class="diff-row"><span class="diff-label">Bank Doc</span><span class="diff-common">${common_pre}</span><span class="diff-hi1">${diff1 || '—'}</span><span class="diff-common">${common_suf}</span></div>
      <div class="diff-row"><span class="diff-label">Coupa Form</span><span class="diff-common">${common_pre}</span><span class="diff-hi2">${diff2 || '—'}</span><span class="diff-common">${common_suf}</span></div>
    </div>`;
  }

  // ── Plain-English mismatch reason ───────────────────────────────
  function getMismatchReason(key) {
    const tips = {
      routing:        'Routing numbers can differ by type (ACH vs Wire/Fedwire). Confirm the correct one with the supplier.',
      account_number: 'Account numbers differ. Verify the exact number directly with the supplier.',
      iban:           'IBANs do not match. Confirm the correct bank account with the supplier.',
      bank_name:      'May be an abbreviation or parent/subsidiary name variation.',
      account_name:   'Check for DBA name or legal name differences.',
      swift:          'SWIFT/BIC codes differ. Verify the correct code with the supplier bank.',
      sort_code:      'Sort codes differ. Confirm the exact sort code with the supplier.',
      bank_address:   'May be a formatting or abbreviation difference.',
      bank_country:   'Confirm the correct payment country with the supplier.',
    };
    return tips[key] || 'Values differ between documents. Verify with the supplier.';
  }

  // ── Confidence level from detection source ───────────────────────
  // ── Document type auto-detection ─────────────────────────────────
  // opts.isPdf defaults to true so the existing swap-check call sites in
  // compareDocuments() (which don't pass opts) keep their current behavior —
  // the PDF-only Coupa rule only needs to bite at upload-time classification.
  function detectDocType(text, opts) {
    const isPdf = !opts || opts.isPdf !== false;
    const t = (text || '').toLowerCase();
    let s = { coupa: 0, bank: 0, tax: 0 };
    // Filename is a weak, corroborating signal only — weighted well below the
    // strong in-document keywords above, so a misleading filename (e.g. a scan
    // saved as "Document1.pdf") can't override real content, but it can tip a
    // borderline/low-text-quality file (a blurry photo, a near-blank OCR pass)
    // toward the right type instead of "unknown".
    // Real filenames separate words with "_" or "." (e.g. "W9_Form_Scan.pdf") — but
    // "_" counts as a word character in regex, so \b wouldn't see a boundary there.
    // Normalize both to spaces first so the \b-based patterns below actually match.
    const filename = ((opts && opts.filename) || '').toLowerCase().replace(/[_.]/g, ' ');
    if (filename) {
      if (isPdf && /\bcoupa\b/.test(filename)) s.coupa += 3;
      if (/\bw-?9\b|\bw-?8\b|\bgstin\b|\bgst\b|\bpan\b|\btax\b|\bvat\b|\bein\b|\btin\b|certificate.?of.?registration/.test(filename)) s.tax += 2;
      if (/\bbank\b|\bvoid(?:ed)?\b|\bwire\b|\bach\b|\bswift\b|\biban\b|remittance/.test(filename)) s.bank += 2;
    }
    if (isPdf) {
      if (t.includes('supplier information')) s.coupa += 3;
      if (t.includes('primary contact'))      s.coupa += 2;
      if (t.includes('banking information'))  s.coupa += 3;
      if (t.includes('po email'))             s.coupa += 2;
      if (t.includes('legal name'))           s.coupa += 2;
      if (t.includes('address purpose'))      s.coupa += 2;
      // Okta-branded onboarding forms are always Coupa supplier forms in this
      // workflow — a strong, mostly-sufficient signal on its own.
      if (/\bokta\b/.test(t) || /okta\.com|oktapreview\.com/.test(t)) s.coupa += 6;
    }
    if (/w-?9|w-?8/.test(t))               s.tax   += 5;
    if (t.includes('taxpayer identification')) s.tax += 4;
    if (t.includes('employer identification')) s.tax += 3;
    if (t.includes('backup withholding'))   s.tax   += 3;
    // International tax documents (VAT/GST/residency certificates, national tax IDs) —
    // without these, non-US vendors' tax docs fall through to "bank" by default.
    if (/value\s+added\s+tax|vat\s+registration|vat\s+number/.test(t)) s.tax += 4;
    if (/goods\s+and\s+services\s+tax|gst\s+registration/.test(t))     s.tax += 4;
    if (/\bgstin\b/.test(t))                s.tax += 4;
    if (/permanent\s+account\s+number|\bpan\s+card\b/.test(t)) s.tax += 4;
    if (/certificate\s+of\s+registration/.test(t)) s.tax += 3;
    if (/certificate\s+of\s+(?:tax\s+)?residency|tax\s+residency/.test(t)) s.tax += 4;
    if (/steuernummer|ust-idnr/.test(t))     s.tax += 4;
    if (/\bsiret\b|\bsiren\b/.test(t))       s.tax += 4;
    if (/codice\s+fiscale/.test(t))          s.tax += 4;
    if (/\bcif\b|\bnif\b/.test(t))           s.tax += 2;
    if (/\bkvk\b|chamber\s+of\s+commerce/.test(t)) s.tax += 2;
    if (t.includes('companies house'))       s.tax += 2;
    if (t.includes('fiscal code'))           s.tax += 3;
    if (/\babn\b|australian\s+business\s+number/.test(t)) s.tax += 4;
    if (/\bacn\b|australian\s+company\s+number/.test(t))  s.tax += 3;
    // Exclude "permanent account number" (PAN) — it contains "account number" as a
    // substring and would otherwise falsely add banking-detail weight to a tax document.
    if (t.includes('account number') && !/permanent\s+account\s+number/.test(t)) s.bank += 2;
    if (t.includes('sort code'))            s.bank  += 3;
    if (t.includes('routing number'))       s.bank  += 3;
    if (/\biban\b/.test(t))                 s.bank  += 2;
    if (t.includes('account statement'))    s.bank  += 3;
    if (/voided?\s+check|void\s+check/.test(t)) s.bank += 4;
    if (/bank\s+letter|bank\s+confirmation|letter\s+of\s+bank/.test(t)) s.bank += 2;
    if (/wire\s+instructions|remittance\s+advice|beneficiary\s+bank/.test(t)) s.bank += 2;
    if (/swift\s*code|\bbic\s+code\b/.test(t)) s.bank += 2;
    if (t.includes('bsb'))                  s.bank += 2;
    const max = Math.max(s.coupa, s.bank, s.tax);
    if (max < 2) return 'unknown';
    if (s.coupa === max) return 'coupa';
    // A document can carry banking details AND an incidental tax-ID mention
    // (e.g. a bank confirmation letter that also prints the vendor's EIN) —
    // banking details should win in that case, per the team's classification rule.
    if (s.bank > 0 && s.bank + 2 >= s.tax) return 'bank';
    return s.tax === max ? 'tax' : 'bank';
  }

  // ── Render ───────────────────────────────────────────────────────
  async function compareDocuments() {
    const el = document.getElementById('results');
    el.innerHTML = '<div class="loading"><div class="spinner"></div><div class="loading-msg">Extracting and comparing fields…</div></div>';
    el.classList.add('visible');
    verifiedNotes = {};

    try {
      const [text1, text2, text3] = await Promise.all([
        extractText(state.file1),
        extractText(state.file2),
        state.file3 ? extractText(state.file3) : Promise.resolve(''),
      ]);

      // ── Auto-detect document types ──────────────────────────────
      const dtype1 = detectDocType(text1);
      const dtype2 = detectDocType(text2);
      let autoDetectWarn = '';
      if (dtype1 === 'coupa' && dtype2 === 'bank') {
        autoDetectWarn = 'Files may be swapped — slot 1 looks like a Coupa form and slot 2 looks like a Bank document.';
      } else if (dtype1 === 'coupa' && dtype2 !== 'coupa') {
        autoDetectWarn = 'The Bank Document slot appears to contain a Coupa supplier form.';
      } else if (dtype2 === 'bank' && dtype1 !== 'bank') {
        autoDetectWarn = 'The Coupa Form slot appears to contain a bank document.';
      } else if (dtype1 === 'tax') {
        autoDetectWarn = 'The Bank Document slot may contain a Tax Form (W-9/W-8).';
      }

      const rows = FIELD_DEFS.map(def => {
        const r1 = def.extract(text1);
        const r2 = def.extract(text2);
        let v1   = r1 ? cleanVal(r1.value) : null;
        let v2   = r2 ? cleanVal(r2.value) : null;
        let as1  = r1 ? r1.detectedAs : null;
        let as2  = r2 ? r2.detectedAs : null;

        // Value-search cross-check: if a label-based extract failed on one side,
        // look for the other side's value as plain text in that document.
        if (def.enableValueSearch) {
          if (!v1 && v2 && searchValueInText(text1, v2)) {
            v1  = v2;
            as1 = 'matched from Coupa form — found in document text';
          } else if (!v2 && v1 && searchValueInText(text2, v1)) {
            v2  = v1;
            as2 = 'matched from Bank Document — found in document text';
          }
        }

        // Account name cross-check: if the extractor picked up a wrong value (e.g. a "SWIFT"
        // badge that appears beside the label), override v1 with the Coupa value when that
        // value is found verbatim in the bank document (e.g. "AI Hub GmbH" under Account Owner).
        if (def.key === 'account_name' && v1 && v2 && normalize(v1) !== normalize(v2)) {
          if (searchValueInText(text1, v2)) {
            v1  = v2;
            as1 = 'matched from Coupa form — found in document text';
          }
        }
        // Account name fallback: extractor found nothing — search for the Coupa value in the bank
        // doc using normalized comparison (strips spaces, dots, dashes — handles "Co.KG" vs "CO K G").
        if (def.key === 'account_name' && !v1 && v2 && v2.length >= 4) {
          const normV2  = normalize(v2);
          const normDoc = normalize(text1);
          if (normDoc.includes(normV2)) {
            v1  = v2;
            as1 = 'matched from Coupa form — found in document text (normalized)';
          }
        }

        // Routing number cross-check: bank documents often list multiple routing numbers
        // (e.g. one for ACH, one for Wire Transfers). The extractor picks the first one found,
        // but the Coupa form has the ACH routing number. If the Coupa routing exists in the
        // bank document, use it as the authoritative value.
        if (def.key === 'routing' && v1 && v2 && normalize(v1) !== normalize(v2)) {
          if (searchValueInText(text1, v2)) {
            v1  = v2;
            as1 = 'matched from Coupa form — found in document text';
          }
        }

        // Account number cross-check: some bank documents list multiple account numbers
        // (e.g. Mercury FX wire instructions show an intermediary bank account "707567692"
        // as well as the actual beneficiary account "202373162909").  The extractor may
        // pick up the wrong one.  If the Coupa account number is present in the bank
        // document, it is the authoritative value — use it.
        if (def.key === 'account_number' && v1 && v2 && normalize(v1) !== normalize(v2)) {
          if (searchValueInText(text1, v2)) {
            v1  = v2;
            as1 = 'matched from Coupa form — found in document text';
          }
        }

        // IBAN cross-check: search with spaces stripped so "FR76 1695 8000..."
        // matches "FR7616958000..." across documents.
        if (def.key === 'iban') {
          if (!v1 && v2) {
            const found = searchIBANInText(text1, v2);
            if (found) { v1 = found; as1 = 'IBAN extracted from bank document'; }
          }
          if (!v2 && v1) {
            const found = searchIBANInText(text2, v1);
            if (found) { v2 = found; as2 = 'IBAN extracted from Coupa form'; }
          }
          // Multi-IBAN bank document: the extractor returns the first IBAN found, but
          // the bank document may list several accounts (e.g. GBP/EUR/USD).  If v1 ≠ v2,
          // check whether the Coupa IBAN is actually present in the bank document — if so
          // the right account was submitted and we should use it as the matched value.
          if (v1 && v2 && normalize(v1) !== normalize(v2)) {
            const found = searchIBANInText(text1, v2);
            if (found) {
              v1  = found;
              as1 = 'IBAN matched from Coupa form — found in bank document';
            }
          }
        }

        // Partial bank name search: "JP MORGAN" in bank doc matches "JP MORGAN CHASE" in Coupa.
        // When exact search fails, try progressively shorter word-prefixes of the known name.
        if (def.key === 'bank_name') {
          const tryPartial = (knownVal, searchText, setFn) => {
            if (knownVal) {
              const words = knownVal.replace(new RegExp(BANK_SUFFIXES.source, 'gi'), '')
                              .trim().toLowerCase().split(/\s+/).filter(w => w.length > 1);
              for (let n = words.length; n >= 2; n--) {
                const partial = words.slice(0, n).join(' ');
                const hay = searchText.toLowerCase().replace(/\s+/g, ' ');
                const idx = hay.indexOf(partial);
                if (idx >= 0) {
                  const snippet = searchText.slice(idx, idx + partial.length + 20)
                                    .split(/[\n,;]/)[0].trim();
                  setFn(snippet || knownVal, `"${partial}" found in document`);
                  return true;
                }
              }
            }
            return false;
          };
          if (!v1 && v2) tryPartial(v2, text1, (val, note) => { v1 = val; as1 = note; });
          if (!v2 && v1) tryPartial(v1, text2, (val, note) => { v2 = val; as2 = note; });

          // If v1 was found but doesn't match v2, check whether the Coupa bank name
          // actually exists verbatim in the bank document (handles cases where the
          // unlabeled detector picks up a marketing tagline instead of the real bank name,
          // e.g. "Your Business. Your Family. Your Bank" vs "Triad Bank").
          // Guard: only run when v2 is a meaningful value (≥ 5 chars and not a single
          // banking keyword like "account") — prevents false matches on form sub-labels.
          if (v1 && v2 && normalize(v1) !== normalize(v2) && v2.length >= 5) {
            if (searchValueInText(text1, v2)) {
              v1  = v2;
              as1 = 'matched from Coupa form — found in document text';
            } else {
              // Partial search: try progressively shorter prefixes of the Coupa name
              tryPartial(v2, text1, (val, note) => { v1 = val; as1 = note; });
            }
          }
        }

        // Bank address cross-check: if the exact Coupa address isn't found in the bank doc,
        // retry with normalized form — handles "Str." vs "Straße"/"Strasse", "ß"→"ss", etc.
        if (def.key === 'bank_address' && !v1 && v2) {
          const normalizeAddr = s => s.toLowerCase()
            .replace(/straße|strasse/gi, 'str')
            .replace(/ß/g, 'ss')
            .replace(/str\.\s*/gi, 'str')
            .replace(/\bstreet\b/gi, 'st')
            .replace(/\broad\b/gi, 'rd')
            .replace(/[.\-,]/g, '')
            .replace(/\s+/g, ' ').trim();
          const normV2  = normalizeAddr(v2);
          const normDoc = normalizeAddr(text1);
          // Match on first 2 meaningful tokens (robust against trailing city/postal)
          const tokens  = normV2.split(' ').filter(Boolean);
          const needle  = tokens.slice(0, 2).join(' ');
          if (needle.length >= 4 && normDoc.includes(needle)) {
            v1  = v2;
            as1 = 'matched from Coupa form — found in document text (abbreviation-normalized)';
          }
        }

        // Raw hint fallback for still-null values
        const h1   = !v1 ? findRawHint(text1, def.hintKeywords) : null;
        const h2   = !v2 ? findRawHint(text2, def.hintKeywords) : null;
        const status = compareVal(v1, v2, def.key);
        let diffHtml = '';
        if (status === 'mismatch' || status === 'missing') {
          diffHtml = getMismatchDetail(v1, v2);
          diffHtml += `<div class="mismatch-reason">💡 ${getMismatchReason(def.key)}</div>`;
        }
        return { ...def, v1, v2, as1, as2, h1, h2, status, diffHtml };
      }).filter(r => r !== null && r.status !== 'skip' && (r.v2 !== null || r.h2 !== null));

      const country = detectCountry(text2);
      const isUS    = country && /united states|usa|\bU\.?S\.?A?\b/i.test(country);

      // Extract vendor company name from the Coupa form.
      // Coupa change-forms show OLD_VALUE NEW_VALUE for updated fields (old is strikethrough
      // in the PDF but plain text when extracted).
      // Strategy: the "Supplier Information" header at the top of the form always shows the
      // OLD/stored company name.  We strip that prefix from the "Company Name" field content
      // to isolate the new (updated) name.  Falls back to word-repeat deduplication for forms
      // that weren't changed.
      const siM = text2.match(/supplier\s+information[:\s]+([^\n]{2,120})/i);
      const oldStoredName = siM ? cleanVal(siM[1]).toLowerCase() : null;

      function dedupeVendorName(val) {
        if (!val || val.length < 8) return val;
        const firstWord = val.trim().split(/\s+/)[0];
        if (!firstWord || firstWord.length < 2) return val;
        const minIdx = Math.floor(val.length * 0.3);
        const safeWord = firstWord.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const m2 = val.slice(minIdx).match(new RegExp('\\b' + safeWord + '\\b', 'i'));
        return m2 ? val.slice(minIdx + m2.index).trim() : val;
      }

      let vendorName = null;
      const cnM = text2.match(/company\s+name[:\s]+(?:[-–•*]\s*)?([^\n]{2,200})/i);
      if (cnM && cnM[1]) {
        let v = cleanVal(cnM[1]);
        if (oldStoredName && v.toLowerCase().startsWith(oldStoredName)) {
          // Strip the old (strikethrough) prefix to get only the new value
          const stripped = v.slice(oldStoredName.length).trim();
          if (stripped.length >= 3) v = stripped;
        } else {
          // No different old name — use word-repeat deduplication as fallback
          v = dedupeVendorName(v);
        }
        if (v.length >= 2 && v.length <= 120 && !/^(legal\s+name|display\s+name|beneficiary\s+name)$/i.test(v)) {
          vendorName = v;
        }
      }
      lastVendorName = vendorName;

      // ── DBA name from Coupa form and/or Tax Form ──────────────────
      // Coupa: "DBA Name" field (sub-label "Display Name" means empty — skip it)
      // W-9:  Line 2 "Business name/disregarded entity name, if different from above"
      let dbaName = null;
      const dbaM = text2.match(/dba\s+name[:\s]+([^\n]{2,80})/i);
      if (dbaM && dbaM[1]) {
        const v = cleanVal(dbaM[1]);
        if (v.length >= 2 && !/^display\s+name$/i.test(v)) dbaName = v;
      }
      if (!dbaName && text3) {
        const dbaTaxM = text3.match(/business\s+name(?:\/disregarded\s+entity\s+name)?[^:\n]{0,60}[:\s]+([^\n]{2,80})/i)
                     || text3.match(/disregarded\s+entity\s+name[:\s]+([^\n]{2,80})/i)
                     || text3.match(/trade\s+name[:\s]+([^\n]{2,80})/i);
        if (dbaTaxM && dbaTaxM[1]) {
          // Strip leading checkbox/selection markers (< > ► ☐ ☑ □ ■ etc.) that appear
          // in W-9 form PDFs when an empty "Business name" field is followed by box 3a.
          const v = cleanVal(dbaTaxM[1]).replace(/^[\<\>►▶☐☑□■✓✗\[\]\(\)]+\s*/, '');
          // Reject W-9 instruction lines (start with step numbers, contain form keywords)
          const isInstruction = /^(\d+[a-z]?\s|check\s+the|if\s+different|if\s+applicable|enter\s+|see\s+instructions|for\s+federal|required|optional|disregarded|sole\s+prop|limited\s+liability|c\s+corp|s\s+corp|partnership|trust|estate)/i.test(v);
          if (v.length >= 2 && v.length <= 80 && !isInstruction && !/^(n\/a|none|na|display\s+name)$/i.test(v)) {
            dbaName = v;
          }
        }
      }

      // ── Tax ID from Coupa form ─────────────────────────────────────
      const taxIdM = text2.match(/(?:federal|international)\s+tax\s+(?:id|identification)(?:\s+number)?[:\s]+([^\n]{2,40})/i);
      const taxId  = taxIdM ? cleanVal(taxIdM[1]) : null;
      const taxIdLabel = isUS ? 'US Tax ID' : 'International Tax ID';

      // ── Primary Address from Coupa form ───────────────────────────
      // Coupa forms prefix required fields with strikethrough placeholder text
      // ("REQUIRED FIELD", "PLEASE INPUT ADDRESS", etc.) — strip them.
      function stripPlaceholder(val) {
        if (!val) return null;
        const c = val
          // Strip underscore-wrapped variants: _Required_Field_, _REQUIRED_FIELD_, etc.
          .replace(/_+required_+field_+\s*/gi, '')
          // Strip space-separated variants at the start or inline
          .replace(/(?:^|\s)required\s+field\s*/gi, ' ')
          // Strip "PLEASE INPUT ..." variants
          .replace(/please\s+(?:input|populate)(?:\s+\w+){0,3}\s*/gi, '')
          .replace(/\s+/g, ' ').trim();
        return c.length >= 2 ? c : null;
      }
      function coupaField(re) {
        const m = text2.match(re);
        return m ? stripPlaceholder(m[1]) : null;
      }
      // Street extraction: scan up to 3 lines after the label so we still get the value
      // when "REQUIRED FIELD" is on its own line and the actual address is on the next line.
      function coupaStreetScan(re) {
        const m = text2.match(re);
        if (!m) return null;
        const afterLabel = text2.slice(m.index + m[0].length);
        const lines = afterLabel.split('\n').slice(0, 4).map(l => l.trim()).filter(Boolean);
        const NEXT_FIELD = /^(?:street\s+address|city|postal|location|address\s+name|address\s+purpose|region|dba)/i;
        for (const line of lines) {
          if (NEXT_FIELD.test(line)) break;
          const v = stripPlaceholder(line);
          if (v && v.length >= 3) return v;
        }
        return null;
      }
      const pStreet1 = coupaStreetScan(/street\s+address(?!\s+\d\b)[:\s]*/i);
      const pStreet2 = coupaStreetScan(/street\s+address\s+2[:\s]*/i);
      const pCity    = coupaField(/(?:^|\n)\s*city[:\s]+([^\n]{2,60})/im);
      // For postal code, scan directly for the digits/code after the label — this tolerates
      // "REQUIRED FIELD" and the actual value being on separate lines (different Y coords).
      // \d{4,10}(?:-\d{2,6})? keeps a US ZIP+4 ("60610-3016") as one value — without the
      // optional dash suffix this stopped at "60610" and silently dropped the "+4" half.
      const pPostalM = text2.match(/(?:^|\n)\s*postal\s+code[\s\S]{0,80}?(\b\d{4,10}(?:-\d{2,6})?\b|\b[A-Z]{1,2}\d{1,2}[A-Z]?\s*\d[A-Z]{2}\b)/im);
      const pPostal  = pPostalM ? pPostalM[1].replace(/\s/g, '') : null;
      // Filter out values that are actually form field labels captured when the field is empty
      // (e.g. "Street Address 2" is empty → next line "Street Address 3" gets captured instead).
      const SUB_LABEL = /^(building\s+number|beneficiary\s+name|suite|floor|unit|street\s+address\s+[2-4]|city|postal\s+code|location\s+code|address\s+name|address\s+purpose|region|dba\s+name|display\s+name|legal\s+name|primary\s+contact)$/i;
      const primaryAddr = [pStreet1, pStreet2, pCity, pPostal]
        .filter(p => p && !SUB_LABEL.test(p))
        .join(', ') || null;

      // ── Remit-To Address from Coupa form ───────────────────────────────────
      // Coupa forms may list multiple addresses (e.g. billing + remit-to) separated
      // by an "Address Purpose: Remit-To" label or a standalone "Remit To" header.
      let remitAddr = null, remitStreet1 = null, remitStreet2 = null;
      let remitCity = null, remitPostal = null, remitCountry = null, remitRegion = null;
      const remitIdx = text2.search(/\b(?:remit[\s\-]+to\b(?:\s+address)?|address\s+(?:name|purpose)[:\s]+remit[\s\-]+to)\b/i);
      if (remitIdx >= 0) {
        // Use a wide window — 2000 chars — to avoid cutting off fields that appear far below the header.
        const rBlock = text2.slice(remitIdx, Math.min(text2.length, remitIdx + 2000));

        // rField(labelPat): extract the value for a labeled form field.
        // Strategy A — same-line inline: "Label   Value" or "Label: Value"
        //   Uses [: \t]+ (no newlines) so we don't accidentally consume to the next line.
        // Strategy B — next-line: value is on the line immediately after the label.
        //   Only returns the next non-blank line if it isn't itself a known field label.
        // Matches if the line STARTS WITH a known label — not just if the whole line IS the
        // label. When a field is empty, its value column collapses and the next field's
        // label ends up sharing a line with ITS OWN value (e.g. "City New York" = the "City"
        // label immediately followed by the actual city value, both on one line because the
        // preceding field rendered nothing). An exact-match check let that whole line get
        // captured as the previous (empty) field's value instead of stopping there.
        const KNOWN_LBL_RE = /^(?:region|street\s+address|city|postal\s+code|location\s+code|address\s+(?:name|purpose)|country|state|remit|billing|banking|dba\s+name|legal\s+name)\b/i;
        const rField = labelPat => {
          // Strategy A: value on the same line
          const aRe = new RegExp('(?:^|\\n)[ \\t]*(?:' + labelPat + ')[: \\t]+([^\\n]{1,120})', 'im');
          const am  = rBlock.match(aRe);
          if (am && am[1]) {
            const v = stripPlaceholder(am[1].trim());
            if (v && v.length >= 1) return v;
          }
          // Strategy B: label on its own line, value on next non-blank line
          const bRe = new RegExp('(?:^|\\n)[ \\t]*(?:' + labelPat + ')[ \\t]*\\n', 'im');
          const bm  = rBlock.match(bRe);
          if (!bm) return null;
          const after = rBlock.slice(bm.index + bm[0].length);
          for (const ln of after.split('\n').slice(0, 8)) {
            const t = ln.trim();
            if (!t) continue;
            if (KNOWN_LBL_RE.test(t)) break;
            const v = stripPlaceholder(t);
            if (v && v.length >= 1) return v;
          }
          return null;
        };

        remitRegion  = rField('region');
        remitStreet1 = rField('street\\s+address(?!\\s+2\\b)(?!\\s*\\d\\b)');
        remitStreet2 = rField('street\\s+address\\s*2');
        remitCity    = rField('city');
        remitCountry = rField('country');

        // Postal: collect ALL matches in the block with a global scan, take the LAST one.
        // This avoids picking up the primary address postal when both appear in the same block.
        // \d{4,10}(?:-\d{2,6})? keeps a US ZIP+4 ("60610-3016") as one value per line — matching
        // bare \d{4,10} globally split it into two separate hits ("60610" and "3016") and the
        // "take the last one" step then grabbed just the "+4" half instead of the full ZIP.
        const postalAll = [];
        const postalGRe = /(?:^|\n)[ \t]*postal\s+code[: \t]*([^\n]{0,60})/gim;
        let pm;
        while ((pm = postalGRe.exec(rBlock)) !== null) {
          const hit = pm[1].match(/\b\d{4,10}(?:-\d{2,6})?\b/);
          if (hit) postalAll.push(hit[0]);
        }
        remitPostal = postalAll.length > 0 ? postalAll[postalAll.length - 1] : null;

        remitAddr = [remitStreet1, remitStreet2, remitCity, remitPostal]
          .filter(p => p && !SUB_LABEL.test(p))
          .join(', ') || null;
      }

      // ── Tax Form verification ─────────────────────────────────────
      // Only runs when a Tax Form (file3) was uploaded.  Checks whether the
      // company name, address, and tax ID from the Coupa form can be found
      // in the Tax Form (W-9, W-8, etc.) using the field keywords the user specified.
      // Each check returns { ok, evidence, needle } instead of a bare boolean so the
      // approver can see exactly what was searched for and what (if anything) was found,
      // rather than a bare ✓/✗ they'd have to take on faith.
      function tfEvidence(rawText, needle, normFn) {
        if (!needle) return { ok: false, evidence: null, needle: null };
        const normT3 = normFn(rawText);
        const idx = normT3.indexOf(normFn(needle));
        if (idx === -1) return { ok: false, evidence: null, needle };
        const rawIdx = rawText.toLowerCase().indexOf(needle.toLowerCase().slice(0, Math.min(needle.length, 15)));
        const evidence = rawIdx >= 0
          ? rawText.slice(Math.max(0, rawIdx - 20), rawIdx + needle.length + 20).replace(/\s+/g, ' ').trim()
          : needle;
        return { ok: true, evidence, needle };
      }
      function tfTip(check) {
        if (!check) return '';
        return check.ok
          ? `Found in Tax Form: "${escHtml(check.evidence || check.needle || '')}"`
          : `Not found in Tax Form${check.needle ? ` — expected "${escHtml(check.needle)}"` : ''}`;
      }

      let tfCheckName = { ok: false, evidence: null, needle: null };
      let tfCheckAddr = { ok: false, evidence: null, needle: null };
      let tfCheckTaxId = { ok: false, evidence: null, needle: null };
      if (text3 && text3.trim().length > 20) {
        // Company name: normalize punctuation on both sides so "PIONEER TOPCO, LP"
        // matches "PIONEER TOPCO LP" (comma/period differences are ignored).
        if (vendorName && vendorName.length >= 3) {
          const normStr = s => s.toLowerCase().replace(/[,.\-]/g, '').replace(/\s+/g, ' ').trim();
          tfCheckName = tfEvidence(text3, vendorName, normStr);
        }

        // Address: try multiple components so we still verify when only city+postal
        // were extracted from the Coupa form (Coupa sometimes omits the street).
        // Also normalize punctuation so "LAS VEGAS, NV 89109" matches "LAS VEGAS 89109".
        {
          const normStr = s => s.toLowerCase().replace(/[,.\-]/g, '').replace(/\s+/g, ' ').trim();
          const addrNeedle = pStreet1 || (pCity && pPostal ? `${pCity}, ${pPostal}` : pPostal) || null;
          // 1. Street match
          if (pStreet1 && pStreet1.length >= 4)
            tfCheckAddr = tfEvidence(text3, pStreet1, normStr);
          // 2. City + postal together (allows state abbreviation between them)
          if (!tfCheckAddr.ok && pCity && pPostal && pCity.length >= 2) {
            const normT3 = normStr(text3);
            const pat = new RegExp(normStr(pCity).replace(/\s+/g,'\\s+') + '[\\s\\S]{0,25}?' + normStr(pPostal));
            const m = normT3.match(pat);
            tfCheckAddr = m
              ? { ok: true, evidence: m[0], needle: `${pCity}, ${pPostal}` }
              : { ok: false, evidence: null, needle: `${pCity}, ${pPostal}` };
          }
          // 3. Postal code alone as last resort
          if (!tfCheckAddr.ok && pPostal && pPostal.length >= 4) {
            const fallback = tfEvidence(text3, pPostal, normStr);
            tfCheckAddr = fallback.ok ? fallback : { ok: false, evidence: null, needle: addrNeedle };
          }
          if (!tfCheckAddr.needle) tfCheckAddr.needle = addrNeedle;
        }

        // Tax ID matching uses several methods because the IRS W-9 stores each EIN digit
        // in a separate AcroForm box field — extraction produces individual lines like
        // "f1_14[0]: 9 / f1_15[0]: 3 / …" whose interleaved field-name digits break
        // a simple contiguous-digit search.
        if (taxId && taxId.length >= 4) {
          const digitsOnly = taxId.replace(/\D/g, '');
          if (digitsOnly.length >= 4) {
            // Find the area around the EIN/Tax ID label — used by Methods 1 & 2
            const einLabelM = text3.match(
              /(?:employer\s+identification\s+number|federal\s+tax\s+(?:id|identification)|foreign\s+tin)([\s\S]{0,2000})/i
            );
            const einArea = einLabelM ? einLabelM[0] : text3;

            // Method 1 — raw digit strip scoped to EIN area, fallback to full text
            let found = einArea.replace(/\D/g, '').includes(digitsOnly)
                     || text3.replace(/\D/g, '').includes(digitsOnly);
            let evidenceSnippet = found && einLabelM ? einLabelM[0].replace(/\s+/g, ' ').trim().slice(0, 80) : null;

            // Method 2 — flexible keyword-anchored search (works for individual-box W-9)
            // Gap increased to 300 chars to handle PDFs where digit boxes are spread out.
            if (!found) {
              const flexPat = digitsOnly.split('').join('[\\s\\S]{0,300}?');
              try {
                const m = einArea.match(new RegExp(flexPat));
                if (m) { found = true; evidenceSnippet = m[0].replace(/\s+/g, ' ').trim().slice(0, 80); }
              } catch(e) {}
            }

            // Method 3 — AcroForm values concatenation
            // The IRS W-9 stores each EIN box digit in a separate AcroForm field, so
            // text3 contains consecutive lines like "f1_14[0]: 9 / f1_15[0]: 3 / …".
            // Extracting just the VALUE portion from every "fieldname: value" line and
            // joining them gives "...934628017..." as a contiguous digit run.
            if (!found) {
              const acroVals = (text3.match(/^[^:\n]+:\s*([^\n]+)/mg) || [])
                .map(ln => ln.replace(/^[^:]+:\s*/, '').trim())
                .join('');
              if (acroVals.replace(/\D/g, '').includes(digitsOnly)) {
                found = true;
                evidenceSnippet = 'Matched via form field values (digit boxes)';
              }
            }

            // Method 4 — direct formatted search (XX-XXXXXXX and space-separated variants)
            if (!found && digitsOnly.length === 9) {
              const ein1 = digitsOnly.slice(0, 2) + '-' + digitsOnly.slice(2);
              const ein2 = digitsOnly.slice(0, 2) + ' ' + digitsOnly.slice(2);
              if (text3.includes(ein1) || text3.includes(ein2) || text3.includes(digitsOnly)) {
                found = true;
                evidenceSnippet = text3.includes(ein1) ? ein1 : (text3.includes(ein2) ? ein2 : digitsOnly);
              }
            }

            tfCheckTaxId = { ok: found, evidence: evidenceSnippet, needle: taxId };
          } else {
            // Alphanumeric Foreign TIN — strip all non-alphanumeric and compare
            const idNeedle = taxId.replace(/[^a-z0-9]/gi, '').toLowerCase();
            const found = text3.replace(/[^a-z0-9]/gi, '').toLowerCase().includes(idNeedle);
            tfCheckTaxId = { ok: found, evidence: found ? taxId : null, needle: taxId };
          }
        }
      }
      const hasTaxForm = text3 && text3.trim().length > 20;

      // DBA tax form check (same punctuation-tolerant normalization as company name)
      let tfCheckDba = { ok: false, evidence: null, needle: null };
      if (dbaName && hasTaxForm) {
        const normStr = s => s.toLowerCase().replace(/[,.\-]/g, '').replace(/\s+/g, ' ').trim();
        tfCheckDba = tfEvidence(text3, dbaName, normStr);
      }

      // ── Contact info from Coupa form ─────────────────────────────
      // Coupa change-forms show OLD NEW on the same line — extract the
      // LAST valid email / phone in the captured text to get the new value.
      // Normalize common PDF ligatures before parsing (e.g. ﬁ → fi, ﬂ → fl).
      // Without this, "ﬁnance@..." is read as "nance@..." because ﬁ ≠ \w.
      function normalizeLigatures(s) {
        return (s || '')
          .replace(/ﬁ/g, 'fi').replace(/ﬂ/g, 'fl').replace(/ﬀ/g, 'ff')
          .replace(/ﬃ/g, 'ffi').replace(/ﬄ/g, 'ffl').replace(/ﬅ/g, 'st');
      }
      function lastEmail(str) {
        if (!str) return null;
        let n = normalizeLigatures(str);
        // Join ligature-split prefixes: "fi nance@..." → "finance@..."
        n = n.replace(/\b([a-z]{1,4})\s+([a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,})/gi,
          (_, pfx, mail) => pfx + mail);
        // Split camelCase-concatenated text from adjacent PDF text items:
        // "scott.davies@grainger.comScott.Davies" → "...grainger.com Scott.Davies"
        n = n.replace(/([a-z])([A-Z])/g, '$1 $2');
        const all = n.match(/[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}/gi);
        return all ? all[all.length - 1] : null;
      }
      // Multi-line email scan: handles value on next line, placeholder on same line,
      // and split prefix text items (e.g. "AP" on one line + "_INQUIRY@..." on next).
      function coupaEmailScan(text, labelRe) {
        const m = text.match(labelRe);
        if (!m) return null;
        const afterLabel = text.slice(m.index + m[0].length);
        const lines = afterLabel.split('\n').slice(0, 6).map(l => l.trim()).filter(Boolean);
        const STOP = /^(?:po\s+email|email\s+address|mobile|phone|primary\s+contact|fax|address|city|region|postal|street)/i;
        let prevLine = '';
        for (const line of lines) {
          if (STOP.test(line)) break;
          const clean = stripPlaceholder(line) || '';
          const email = lastEmail(clean || line);
          if (email) return email;
          // Try joining with previous line for split items: "AP" + "_INQUIRY@..." → "AP_INQUIRY@..."
          if (prevLine) {
            const joined = lastEmail(prevLine + (clean || line));
            if (joined) return joined;
          }
          prevLine = clean || line;
        }
        return null;
      }
      function lastPhone(str) {
        if (!str) return null;
        const all = str.match(/\+?[\d][\d\s\(\)\-]{7,20}\d/g);
        return all ? all[all.length - 1].replace(/\s+/g, ' ').trim() : null;
      }
      function validatePhone(phone, detectedCountry) {
        if (!phone) return null;
        const digits = phone.replace(/\D/g, '');
        // Country code → { label, minLen, maxLen, countryKeywords }
        const CC = {
          '1':   { label: 'US / Canada',   min: 11, max: 11, kw: /united states|usa|canada/i },
          '44':  { label: 'UK',             min: 11, max: 12, kw: /united kingdom|england|scotland|wales/i },
          '61':  { label: 'Australia',      min: 11, max: 11, kw: /australia/i },
          '49':  { label: 'Germany',        min: 10, max: 13, kw: /germany|deutschland/i },
          '33':  { label: 'France',         min: 11, max: 11, kw: /france/i },
          '47':  { label: 'Norway',         min: 10, max: 10, kw: /norway/i },
          '31':  { label: 'Netherlands',    min: 11, max: 11, kw: /netherlands|holland/i },
          '81':  { label: 'Japan',          min: 11, max: 12, kw: /japan/i },
          '65':  { label: 'Singapore',      min: 10, max: 10, kw: /singapore/i },
          '91':  { label: 'India',          min: 12, max: 12, kw: /india/i },
          '34':  { label: 'Spain',          min: 11, max: 11, kw: /spain/i },
          '39':  { label: 'Italy',          min: 11, max: 13, kw: /italy/i },
          '55':  { label: 'Brazil',         min: 12, max: 13, kw: /brazil/i },
          '52':  { label: 'Mexico',         min: 12, max: 12, kw: /mexico/i },
          '82':  { label: 'South Korea',    min: 11, max: 12, kw: /korea/i },
          '971': { label: 'UAE',            min: 12, max: 12, kw: /emirates|uae/i },
          '972': { label: 'Israel',         min: 12, max: 12, kw: /israel/i },
          '48':  { label: 'Poland',         min: 11, max: 11, kw: /poland/i },
          '46':  { label: 'Sweden',         min: 10, max: 12, kw: /sweden/i },
          '41':  { label: 'Switzerland',    min: 11, max: 11, kw: /switzerland/i },
          '63':  { label: 'Philippines',    min: 12, max: 12, kw: /philippines/i },
          '64':  { label: 'New Zealand',    min: 10, max: 11, kw: /new zealand/i },
        };
        // Try 3-digit codes first, then 2-digit, then 1-digit
        const order = ['971','972','63','64','55','52','82','86','91','65','81','47','49','33','44','61','48','46','41','34','39','31','1'];
        let info = null, code = null;
        for (const c of order) {
          if (digits.startsWith(c) && CC[c]) { code = c; info = CC[c]; break; }
        }
        if (!info) return { valid: false, tip: '✗ Invalid — unrecognized country code' };
        const lenOk = digits.length >= info.min && digits.length <= info.max;
        if (!lenOk) return { valid: false, tip: `✗ Invalid — wrong digit count for +${code} (${info.label})` };
        if (detectedCountry && info.kw && !info.kw.test(detectedCountry))
          return { valid: false, tip: `✗ Invalid — +${code} is ${info.label}, country is ${detectedCountry}` };
        return { valid: true, tip: `✓ Valid — ${info.label} number` };
      }
      const t2n = normalizeLigatures(text2);   // ligature-normalized Coupa text
      const cPhoneM   = t2n.match(/mobile\s+(?:phone|number)[:\s]+([^\n]{5,80})/i);
      const contactEmail = coupaEmailScan(t2n, /email\s+address\s*[:\s]*/i);
      const mobilePhone  = cPhoneM ? lastPhone(cPhoneM[1]) : null;
      const poEmail      = coupaEmailScan(t2n, /po\s+email\s*[:\s]*/i);
      const hasContact   = contactEmail || mobilePhone || poEmail;

      // Swift Code is not applicable for US domestic transfers
      const US_FIELDS    = ['account_name', 'iban', 'account_number', 'routing', 'bank_name', 'bank_address', 'bank_country', 'bank_postal'];
      const filteredRows = isUS ? rows.filter(r => US_FIELDS.includes(r.key)) : rows;

      const mismatches = filteredRows.filter(r => r.status === 'mismatch');
      const missing    = filteredRows.filter(r => r.status === 'missing');
      const matches    = filteredRows.filter(r => r.status === 'match');
      const isImage    = text1.startsWith('[IMAGE') || text2.startsWith('[IMAGE');

      lastRows = filteredRows;
      let html = `<div class="results-header">
        <h2>Comparison Results</h2>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
          <div class="badges">
            ${mismatches.length ? `<span class="badge badge-mismatch">✗ ${mismatches.length} Mismatch${mismatches.length > 1 ? 'es' : ''}</span>` : ''}
            ${missing.length    ? `<span class="badge badge-missing">? ${missing.length} Field${missing.length > 1 ? 's' : ''} Missing</span>` : ''}
            ${(mismatches.length > 0 || missing.length > 0) ? `<span class="badge badge-match">✓ ${matches.length} Match${matches.length !== 1 ? 'es' : ''}</span>` : ''}
          </div>
          <div class="export-wrap">
            <button class="btn-export" onclick="exportCSV()" title="Export as CSV">
              <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              Export CSV
            </button>
            <button class="btn-export" onclick="printResults()" title="Print or save as PDF">
              <svg viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
              Print / PDF
            </button>
          </div>
        </div>
      </div>
      <div class="vendor-info-wrap">
        <div class="vendor-info-main">
          ${vendorName ? `<div class="vendor-name-line"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>${escHtml(vendorName)}${hasTaxForm ? `<span class="tf-badge ${tfCheckName.ok ? 'tf-verified' : 'tf-missing'}" data-tip="${tfTip(tfCheckName)}">${tfCheckName.ok ? '✓' : '✗'}</span>` : ''}</div>` : ''}
          ${dbaName ? `<div class="vendor-meta" style="padding-left:23px;margin-top:1px;"><span style="font-size:10px;font-weight:700;color:#a0aec0;text-transform:uppercase;letter-spacing:0.4px;margin-right:4px;">DBA</span>${escHtml(dbaName)}${hasTaxForm ? `<span class="tf-badge ${tfCheckDba.ok ? 'tf-verified' : 'tf-missing'}" data-tip="${tfTip(tfCheckDba)}">${tfCheckDba.ok ? '✓' : '✗'}</span>` : ''}</div>` : ''}
          ${(taxId || primaryAddr || country) ? `<hr class="vendor-info-divider">` : ''}
          ${taxId ? `<div class="vendor-meta"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/><path d="M6 15h4"/></svg><span><span class="vendor-meta-label">${taxIdLabel}:</span> ${escHtml(taxId)}${hasTaxForm ? `<span class="tf-badge ${tfCheckTaxId.ok ? 'tf-verified' : 'tf-missing'}" data-tip="${tfTip(tfCheckTaxId)}">${tfCheckTaxId.ok ? '✓' : '✗'}</span>` : ''}</span></div>` : ''}
          ${primaryAddr ? `<div class="vendor-meta"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg><span>${escHtml(primaryAddr)}${hasTaxForm ? `<span class="tf-badge ${tfCheckAddr.ok ? 'tf-verified' : 'tf-missing'}" data-tip="${tfTip(tfCheckAddr)}">${tfCheckAddr.ok ? '✓' : '✗'}</span>` : ''}</span></div>` : ''}
          ${country ? `<div class="vendor-meta"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg><span><span class="vendor-meta-label">Country:</span> ${escHtml(country)}</span></div>` : ''}
        </div>
        ${hasContact ? `<div class="vendor-contact-panel">
          <div class="vendor-contact-title">Primary Contact</div>
          ${contactEmail ? `<div class="vendor-contact-row"><svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg><span><a href="mailto:${escHtml(contactEmail)}">${escHtml(contactEmail)}</a></span></div>` : ''}
          ${mobilePhone ? (() => { const pv = validatePhone(mobilePhone, country); return `<div class="vendor-contact-row"><svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg><span class="phone-tip" data-tip="${pv ? escHtml(pv.tip) : ''}">${escHtml(mobilePhone)}</span></div>`; })() : ''}
          ${poEmail ? `<div class="vendor-contact-row"><svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg><span><span class="vc-label">PO:</span><a href="mailto:${escHtml(poEmail)}">${escHtml(poEmail)}</a></span></div>` : ''}
        </div>` : ''}
      </div>`;

      if (autoDetectWarn) {
        html += `<div class="autodetect-banner">
          <svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          <strong>Auto-Detect:</strong>&nbsp;${escHtml(autoDetectWarn)}
        </div>`;
      }

      if (mismatches.length === 0 && missing.length === 0 && matches.length > 0) {
        const comparedDocs = hasTaxForm ? 'Bank Document, Coupa Form, and Tax Form' : 'Bank Document and Coupa Form';
        html += `<div class="all-match-bar">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          All Fields Match
          <span class="all-match-sub">— Good to proceed. All details across the ${comparedDocs} are consistent.</span>
        </div>`;
      }

      if ((mismatches.length + missing.length) >= 5) {
        html += `<div class="alert-manual" id="needsManualBanner">
          <div class="alert-manual-icon">⚠️</div>
          <div>
            <div class="alert-manual-title">Needs Manual Checking</div>
            <div class="alert-manual-sub">${mismatches.length + missing.length} fields have mismatches or missing values — please review this vendor's banking details manually before proceeding.</div>
          </div>
        </div>`;
      }

      if (isImage) {
        html += `<div class="alert alert-info">ℹ OCR was used to read text from one or both image files. Accuracy depends on image quality — review the Extracted Text Preview below to verify what was read.</div>`;
      }

      if (mismatches.length === 0 && missing.length === 0 && matches.length === 0) {
        html += `<div class="no-extract"><strong>No fields could be extracted.</strong> This usually means:<br>
          • The PDFs are scanned images (not text-based)<br>
          • The document uses non-standard formatting<br>
          • The files may be password-protected<br><br>
          Check the <em>Extracted Text Preview</em> below to see what was parsed.</div>`;
      } else {
        // Sort: mismatches → missing → matches; within each group high-priority first
        const order = { mismatch: 0, missing: 1, match: 2 };
        const pord  = { high: 0, medium: 1, low: 2 };
        const gord = { 'Banking Information': 0 };
        filteredRows.sort((a, b) =>
          (gord[a.group] ?? 9) - (gord[b.group] ?? 9) ||
          order[a.status] - order[b.status] ||
          pord[a.priority] - pord[b.priority]
        );

        html += `<table>
          <thead>
            <tr>
              <th style="width:16%">Field</th>
              <th style="width:24%" id="colSrc">Bank Document</th>
              <th style="width:24%">Coupa Form</th>
              <th style="width:10%">Status</th>
              <th style="width:26%">Mismatch Detail</th>
            </tr>
          </thead>
          <tbody>`;
        let currentGroup = null;
        filteredRows.forEach(r => {
          if (r.group && r.group !== currentGroup) {
            currentGroup = r.group;
            const srcName   = 'Bank Document';
            const groupKey = r.group.replace(/\s+/g, '-').toLowerCase();
            html += `<tr class="group-header" data-group-key="${groupKey}" onclick="toggleGroup('${groupKey}')"><td colspan="5">${escHtml(r.group)} <span style="font-weight:400;opacity:0.7;font-size:10px">— comparing ${srcName} vs Coupa Form</span><em class="toggle-arrow">▼</em></td></tr>`;
          }
          const vc = r.status === 'match' ? 'val-match' : r.status === 'mismatch' ? 'val-mismatch' : 'val-missing';
          // Cell 1: Bank Document value (or raw hint)
          const cell1 = r.v1
            ? `<span class="val ${vc}">${escHtml(r.v1)}</span>`
            : r.h1
              ? `<span class="val val-hint">${escHtml(r.h1)}</span><div class="hint-note">⚠ raw text (unverified)</div>`
              : `<span class="val val-missing">Not found</span>`;

          // Cell 2: Coupa Form value (or raw hint)
          const cell2 = r.v2
            ? `<span class="val ${vc}">${escHtml(r.v2)}</span>`
            : r.h2
              ? `<span class="val val-hint">${escHtml(r.h2)}</span><div class="hint-note">⚠ raw text (unverified)</div>`
              : `<span class="val val-missing">Not found</span>`;

          const needsVerify = r.status === 'mismatch' || r.status === 'missing';
          const verifyBtn   = needsVerify
            ? `<button class="btn-verify" onclick="promptVerifyNote('${r.key}')">Mark as Verified</button>`
            : '';

          const rowGroupKey = r.group ? r.group.replace(/\s+/g, '-').toLowerCase() : '';
          const col1Label   = 'Bank Doc';
          html += `<tr id="row-${r.key}" class="priority-${r.priority}" data-group="${rowGroupKey}">
            <td class="field-name" data-label="Field">${isUS && r.key === 'routing' ? 'ACH Routing Number' : r.label}</td>
            <td data-label="${col1Label}">${cell1}</td>
            <td data-label="Coupa Form">${cell2}</td>
            <td class="status status-${r.status}" id="status-${r.key}" data-label="Status">${statusIcon(r.status)}${verifyBtn}</td>
            <td id="diff-${r.key}" data-label="Detail">${r.diffHtml || '—'}</td>
          </tr>`;
        });
        html += `</tbody></table>
          <p style="font-size:11px;color:#a0aec0;margin-top:10px;">* High-priority fields &nbsp;|&nbsp; ⚠ Raw text = keyword found but value could not be cleanly parsed</p>
          <div class="all-verified-banner" id="allVerifiedBanner">
            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
            All Items Verified
            <span class="all-match-sub">— All mismatches and missing fields have been manually reviewed. Good to proceed.</span>
          </div>`;
      }

      // ── Remit-To Address dropdown ──────────────────────────────────────────
      if (remitAddr || remitRegion || remitCity) {
        // Compare on expanded/normalized address text (abbreviations spelled out, punctuation
        // stripped) with containment both ways — same approach as the bank_address field check
        // above. A plain normalize()+equality check falsely flagged addresses that are the same
        // place but formatted differently (e.g. "St" vs "Street", or one side omitting the country).
        const naPrimary = normalizeAddress(primaryAddr);
        const naRemit   = normalizeAddress(remitAddr);
        const addrMatch = !!(naPrimary && naRemit && (naPrimary === naRemit || naPrimary.includes(naRemit) || naRemit.includes(naPrimary) || sameAddressTokens(naPrimary, naRemit)));
        html += `
        <div class="remit-section" id="remitSection">
          <button class="remit-toggle" onclick="toggleRemit()">
            <span class="remit-toggle-arrow">&#9660;</span>
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" style="flex-shrink:0"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            Remit-To Address Information
            ${remitAddr && primaryAddr
              ? addrMatch
                ? `<span class="remit-badge remit-match">&#10003; Matches primary address</span>`
                : `<span class="remit-badge remit-diff">Different from primary address</span>`
              : ''
            }
          </button>
          <div class="remit-body">
            <table class="remit-table"><tbody>
              ${remitRegion  ? `<tr><td class="remit-label">Region</td><td>${escHtml(remitRegion)}</td></tr>` : ''}
              ${remitStreet1 ? `<tr><td class="remit-label">Street Address</td><td>${escHtml(remitStreet1)}</td></tr>` : ''}
              ${remitStreet2 ? `<tr><td class="remit-label">Street Address 2</td><td>${escHtml(remitStreet2)}</td></tr>` : ''}
              ${remitCity    ? `<tr><td class="remit-label">City</td><td>${escHtml(remitCity)}</td></tr>` : ''}
              ${remitPostal  ? `<tr><td class="remit-label">Postal Code</td><td>${escHtml(remitPostal)}</td></tr>` : ''}
              ${remitCountry ? `<tr><td class="remit-label">Country</td><td>${escHtml(remitCountry)}</td></tr>` : ''}
            </tbody></table>
            ${remitAddr && primaryAddr && !addrMatch ? `
            <div class="remit-warn-box">
              <svg viewBox="0 0 24 24" width="15" height="15" stroke="#b45309" stroke-width="2" fill="none" style="flex-shrink:0;margin-top:1px"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
              This Remit-To address differs from the Primary Address on file — confirm with the vendor before processing payment.
            </div>` : ''}
          </div>
        </div>`;
      }

      html += `<hr class="divider" />
        <div class="raw-section">
          <button class="raw-toggle" onclick="toggleRawText(this)">
            <span class="arrow">▼</span> Show Extracted Text Preview
          </button>
          <div class="raw-body">
            <div class="text-grid">
              <div>
                <div class="text-box-label">Bank Document — ${escHtml(state.file1.name)}</div>
                <div class="text-box">${escHtml(text1.slice(0, 2000))}${text1.length > 2000 ? '\n…(truncated)' : ''}</div>
              </div>
              <div>
                <div class="text-box-label">Coupa Form — ${escHtml(state.file2.name)}</div>
                <div class="text-box">${escHtml(text2.slice(0, 2000))}${text2.length > 2000 ? '\n…(truncated)' : ''}</div>
              </div>
            </div>
          </div>
        </div>`;

      el.innerHTML = html;
      collapseUpload();
      applyDraftIfMatching();
      saveReviewSnapshot();

      if (mismatches.length === 0 && missing.length === 0 && matches.length > 0) {
        playBellSound();
      }
    } catch (err) {
      el.innerHTML = `<div class="alert alert-warn">Error processing documents: ${escHtml(err.message)}</div>`;
    }
  }

  // ── Document Preview Modal ───────────────────────────────────────
  let modalZoom = 1.0;

  async function openDocModal(n) {
    const file = state['file' + n];
    if (!file) return;
    const modal   = document.getElementById('docModal');
    const content = document.getElementById('modalContent');
    const title   = document.getElementById('modalTitle');
    modalZoom = 1.0;
    updateZoomLabel();
    content.style.transform = '';
    title.textContent = file.name;
    content.innerHTML = '<div class="loading"><div class="spinner"></div><div class="loading-msg">Loading document…</div></div>';
    modal.classList.add('open');
    document.body.style.overflow = 'hidden';

    if (file.type.startsWith('image/')) {
      const url = URL.createObjectURL(file);
      content.innerHTML = `<img src="${url}" alt="${file.name}" onload="URL.revokeObjectURL(this.src)">`;
    } else if (file.type === 'application/pdf') {
      const buf = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument(buf).promise;
      content.innerHTML = '';
      for (let i = 1; i <= pdf.numPages; i++) {
        const page     = await pdf.getPage(i);
        const viewport = page.getViewport({ scale: 2.0 });
        const wrap     = document.createElement('div');
        if (pdf.numPages > 1) {
          const lbl = document.createElement('div');
          lbl.className = 'modal-page-label';
          lbl.textContent = `Page ${i} of ${pdf.numPages}`;
          wrap.appendChild(lbl);
        }
        const canvas   = document.createElement('canvas');
        canvas.width   = viewport.width;
        canvas.height  = viewport.height;
        wrap.appendChild(canvas);
        content.appendChild(wrap);
        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
      }
    }
  }

  function closeModal() {
    document.getElementById('docModal').classList.remove('open');
    document.body.style.overflow = '';
  }

  function closeModalOnBg(e) {
    if (e.target === document.getElementById('docModal')) closeModal();
  }

  function zoomModal(delta) {
    if (delta === 'reset') { modalZoom = 1.0; }
    else { modalZoom = Math.min(3.0, Math.max(0.4, modalZoom + delta)); }
    document.getElementById('modalContent').style.transform = `scale(${modalZoom})`;
    updateZoomLabel();
  }

  function updateZoomLabel() {
    document.getElementById('zoomLabel').textContent = Math.round(modalZoom * 100) + '%';
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
    if (document.getElementById('docModal').classList.contains('open')) {
      if (e.key === '+' || e.key === '=') { e.preventDefault(); zoomModal(0.25); }
      if (e.key === '-')                  { e.preventDefault(); zoomModal(-0.25); }
      if (e.key === '0')                  { e.preventDefault(); zoomModal('reset'); }
    }
  });

  // ── Manual verification ──────────────────────────────────────────
  // Clicking "Mark as Verified" opens an inline note box rather than instantly
  // flipping the badge, so the reviewer can record *why* it's OK — this becomes
  // part of the audit trail (CSV export, vendor history, draft autosave).
  function promptVerifyNote(key) {
    const diffCell = document.getElementById('diff-' + key);
    if (!diffCell) return;
    diffCell.dataset.prevHtml = diffCell.innerHTML;
    diffCell.innerHTML = `<div class="verify-note-box">
      <textarea id="note-${key}" placeholder="Optional note — why is this OK? (e.g. confirmed with vendor by phone)"></textarea>
      <div class="vnb-actions">
        <button class="vnb-save" onclick="saveVerifiedNote('${key}')">Save</button>
        <button class="vnb-cancel" onclick="cancelVerifyNote('${key}')">Cancel</button>
      </div>
    </div>`;
    const ta = document.getElementById('note-' + key);
    if (ta) ta.focus();
  }

  function cancelVerifyNote(key) {
    const diffCell = document.getElementById('diff-' + key);
    if (diffCell && diffCell.dataset.prevHtml !== undefined) diffCell.innerHTML = diffCell.dataset.prevHtml;
  }

  function saveVerifiedNote(key) {
    const row        = document.getElementById('row-' + key);
    const statusCell = document.getElementById('status-' + key);
    const diffCell   = document.getElementById('diff-' + key);
    if (!row || !statusCell) return;
    const ta     = document.getElementById('note-' + key);
    const note   = ta ? ta.value.trim() : '';
    const timestamp = new Date().toLocaleString();

    verifiedNotes[key] = { note, timestamp };

    row.classList.add('row-verified');
    statusCell.className = 'status status-manually-verified';
    statusCell.innerHTML = '✓ Verified';
    if (diffCell) diffCell.innerHTML = `<div class="verified-note-display"><div class="vnd-meta">✓ Verified on ${escHtml(timestamp)}</div>${note ? `<div class="vnd-text">"${escHtml(note)}"</div>` : ''}</div>`;
    showToast('✓ Field marked as verified');
    checkAllVerified();
    saveDraft();
    saveReviewSnapshot();
  }

  function playBellSound() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();

      function playNote(freq, startTime, duration, volume) {
        // Blend sine + triangle for a warm, rich success tone
        [['sine', 1.0], ['triangle', 0.3]].forEach(([type, amp]) => {
          const osc  = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = type;
          osc.frequency.setValueAtTime(freq, startTime);
          gain.gain.setValueAtTime(0, startTime);
          gain.gain.linearRampToValueAtTime(volume * amp, startTime + 0.012);
          gain.gain.setValueAtTime(volume * amp, startTime + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
          osc.start(startTime);
          osc.stop(startTime + duration);
        });
      }

      // Two-note success: E5 → B5 (perfect fifth — uplifting and conclusive)
      playNote(659.25, ctx.currentTime,        0.6, 0.35); // E5 — quick
      playNote(987.77, ctx.currentTime + 0.16, 1.0, 0.45); // B5 — sustained
    } catch (e) {}
  }

  function checkAllVerified() {
    const rows = document.querySelectorAll('tbody tr[id^="row-"]');
    const allDone = Array.from(rows).every(row => {
      const s = row.querySelector('.status');
      return s && (s.classList.contains('status-match') || s.classList.contains('status-manually-verified'));
    });
    const banner = document.getElementById('allVerifiedBanner');
    if (!banner) return;
    const manualBanner = document.getElementById('needsManualBanner');
    if (allDone) {
      if (manualBanner) manualBanner.style.display = 'none';
      playBellSound();
      banner.innerHTML = `
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        All Items Verified
        <span class="all-match-sub">— All mismatches and missing fields have been manually reviewed. Good to proceed.</span>`;
      banner.style.display = 'flex';
    } else {
      banner.style.display = 'none';
    }
  }

  function toggleRawText(btn) {
    const body = btn.nextElementSibling;
    const isOpen = body.classList.toggle('open');
    btn.classList.toggle('open', isOpen);
    btn.querySelector('.arrow').textContent = isOpen ? '▲' : '▼';
    btn.childNodes[1].textContent = isOpen ? ' Hide Extracted Text Preview' : ' Show Extracted Text Preview';
  }

  function statusIcon(s) {
    if (s === 'match')    return '✓ Match';
    if (s === 'mismatch') return '✗ Mismatch';
    return '? Missing';
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ── Toast notification ───────────────────────────────────────────
  let _toastTimer = null;
  function showToast(msg) {
    let t = document.getElementById('_toast');
    if (!t) {
      t = document.createElement('div');
      t.id = '_toast';
      t.className = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
  }

  // ── Export CSV ───────────────────────────────────────────────────
  function exportCSV() {
    if (!lastRows.length) return;
    const headers = ['Field', 'Group', 'Bank Document', 'Coupa Form', 'Status', 'Note', 'Verified At'];
    const rows = lastRows.map(r => {
      const vn = verifiedNotes[r.key];
      return [
        r.key === 'routing' ? 'ACH Routing Number' : r.label,
        r.group || '',
        r.v1 || (r.h1 ? r.h1 + ' (unverified)' : 'Not found'),
        r.v2 || (r.h2 ? r.h2 + ' (unverified)' : 'Not found'),
        r.status,
        vn ? vn.note : '',
        vn ? vn.timestamp : ''
      ];
    });
    const csv = [headers, ...rows]
      .map(row => row.map(c => `"${String(c).replace(/"/g, '""')}"`).join(','))
      .join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'validation-results.csv';
    a.click();
    URL.revokeObjectURL(a.href);
    showToast('CSV exported');
  }

  // ── Print / Save as PDF ──────────────────────────────────────────
  function printResults() {
    window.print();
  }

  // ── Collapsible field groups ─────────────────────────────────────
  function toggleGroup(key) {
    const header = document.querySelector(`tr.group-header[data-group-key="${key}"]`);
    if (!header) return;
    const rows = document.querySelectorAll(`tr[data-group="${key}"]`);
    const isCollapsed = header.classList.toggle('collapsed');
    rows.forEach(r => { r.style.display = isCollapsed ? 'none' : ''; });
  }

  function toggleRemit() {
    document.getElementById('remitSection').classList.toggle('rt-collapsed');
  }
</script>
